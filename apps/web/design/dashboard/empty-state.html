<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stagecraft — Dashboard empty state (redesign comp)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        </span>
        Stagecraft
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#" aria-current="page">Sites</a>
        <a href="#">Domains</a>
        <a href="#">Settings</a>
      </nav>
      <span class="topbar__spacer"></span>
      <div class="topbar__actions">
        <button class="account" type="button">
          <span class="avatar" aria-hidden="true">NR</span>
          <span class="account__name">Nora Ellison</span>
          <span class="account__chev" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </button>
        <button class="hamburger" type="button" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </header>

    <main class="container container--hero">
      <div class="empty">
        <div class="empty__art" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M12 13v4M10 15h4"/></svg>
        </div>
        <h1>Let's build your first site</h1>
        <p>
          Stagecraft turns a few details into a polished, ready-to-publish
          musician website — pick a theme, add your music and shows, and go live.
          You can also import an existing site to migrate it over.
        </p>
        <div class="empty__actions">
          <a class="btn btn--primary btn--lg" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New site
          </a>
          <a class="btn btn--ghost btn--lg" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            Import existing site
          </a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
