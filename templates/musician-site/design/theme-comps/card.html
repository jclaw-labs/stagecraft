<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Card — simple one-pager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1c1a17; --paper:#f4f1ea; --muted:#7a756c; --line:#ded8cc; --accent:#9a6b4b;
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  .screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 28px}
  .avatar{width:128px;height:128px;border-radius:50%;margin-bottom:34px;
    background:radial-gradient(circle at 38% 32%, #c89a72, #9a6b4b 55%, #4d3525);
    box-shadow:0 18px 40px -22px rgba(40,30,20,.6)}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,72px);line-height:1.05;letter-spacing:-0.01em}
  .tagline{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--muted);margin-top:14px}

  .links{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;margin:40px auto 0}
  .link{display:block;padding:15px 20px;border:1px solid var(--line);border-radius:12px;background:#fff;
    font-weight:500;font-size:15px;transition:border-color .15s,transform .15s}
  .link:hover{border-color:var(--accent);transform:translateY(-1px)}
  .link.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  .socials{display:flex;gap:24px;justify-content:center;margin-top:34px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .socials a{text-decoration:none;color:inherit}
  .socials a:hover{color:var(--ink)}

  footer{padding:26px;text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
  <div class="screen">
    <div class="avatar"></div>
    <div class="eyebrow">Singer · Songwriter</div>
    <h1>Aurelia Wren</h1>
    <div class="tagline">cinematic folk from the high desert</div>

    <div class="links">
      <a class="link primary">Listen to the new album</a>
      <a class="link">Tour dates</a>
      <a class="link">Merch &amp; vinyl</a>
      <a class="link">Mailing list</a>
    </div>

    <nav class="socials">
      <a>Instagram</a><a>Spotify</a><a>Bandcamp</a><a>YouTube</a>
    </nav>
  </div>
  <footer>© 2026 Aurelia Wren</footer>
</body>
</html>
