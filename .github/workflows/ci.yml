name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  monorepo:
    name: Monorepo (apps + packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - name: Bare next build (no pre-generated template bundle)
        working-directory: apps/web
        run: npx next build

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # Cloudflare Worker build (#311): OpenNext bundles the app, then a
      # wrangler --dry-run bundles the Worker entry and prints its compressed
      # size (limit 3 MB free / 10 MB paid). Nothing is deployed and no
      # Cloudflare credentials are used. The Netlify build above is unchanged.
      # The output is kept for the size gate below.
      - name: Cloudflare Worker build (no deploy)
        working-directory: apps/web
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          npm run build:worker 2>&1 | tee "$RUNNER_TEMP/worker-build.log"

      # Fails above the 3,072 KiB gzip limit (Workers Free) and warns from
      # 2,900 KiB (#328). Also fails when the size line can't be found, so a
      # wrangler output change can't turn this into a silent pass.
      - name: Cloudflare Worker size gate
        working-directory: apps/web
        run: node scripts/worker-size-gate.mjs --limit 3072 --warn 2900 "$RUNNER_TEMP/worker-build.log"

  security-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking gate: fail on any HIGH or CRITICAL advisory in any of the
      # repo's npm projects, except the advisories allowlisted (with reason
      # and removal condition) in .github/audit-allowlist.json (#315).
      # `npm audit` reads the lockfile, so no install is needed. The gate
      # warns when an allowlist entry stops matching, so it can be deleted.
      # Renovate (renovate.json) + per-site Dependabot open security PRs
      # that bypass the 7-day cooldown.
      - name: Audit — fail on high (allowlist in .github/audit-allowlist.json)
        run: npm run audit:gate

  # TEMPORARY STUB (ADR-014). The real `musician-site-legacy` template + its CI
  # job were removed, but "Template (musician-site-legacy)" is still a *required*
  # status check in branch protection — and a required check that never runs
  # blocks every PR from merging. This no-op reports that check green so the
  # legacy-removal PRs can land. CLEANUP: drop "Template (musician-site-legacy)"
  # from the required status checks on `main`, then delete this job. Tracked in
  # docs/musician-site-legacy-removal-plan.md.
  musician-site-legacy:
    name: Template (musician-site-legacy)
    runs-on: ubuntu-latest
    steps:
      - run: echo "musician-site-legacy retired in ADR-014; stub satisfying a stale required status check (see comment above)."

  musician-site:
    name: Template (musician-site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/musician-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/musician-site/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # Cache the Playwright browser binaries — saves ~30-60s per run
      # once warm. Keyed off package-lock so a Playwright version bump
      # busts the cache and forces a fresh install.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('templates/musician-site/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System deps for the cached-browser path (the binary cache hits
      # but the OS deps don't persist across runners).
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: templates/musician-site/playwright-report/
          retention-days: 7

  # Apply any pending Prisma migrations to the production Neon DB after
  # a PR merges to main. Runs only on push-to-main (not on PRs, where the
  # new migration always shows pending and would force a manual step).
  #
  # Why apply, not verify: a merged PR with a migration triggers two
  # parallel deploys — this job, and Netlify's build. If we only verified
  # here, prod would throw P2022 on the new column until someone ran
  # `npm run db:migrate:prod` locally. `migrate deploy` is idempotent —
  # a no-op when there's nothing pending — so it's safe to run every push.
  #
  # Race window: Netlify's build (~90s) is much slower than this job
  # (~10s with cached node_modules), so the migration usually lands well
  # before the new code goes live. Not bulletproof — for stricter
  # ordering, run the migration as part of the Netlify build itself.
  #
  # Skipped when the PRODUCTION_DATABASE_URL secret is unset (e.g. on forks).
  db-migrations-applied:
    name: DB migrations applied to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - name: Apply pending migrations to production
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: packages/db
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "::warning::PRODUCTION_DATABASE_URL secret not set; skipping migration apply."
            exit 0
          fi
          # Idempotent: no-op when no pending migrations.
          DATABASE_URL="$PRODUCTION_DATABASE_URL" npx prisma migrate deploy
