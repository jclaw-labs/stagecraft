name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  monorepo:
    name: Monorepo (apps + packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

  security-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking gate: fail on any CRITICAL advisory in any of the repo's
      # npm projects. `npm audit` reads the lockfile, so no install is
      # needed. Threshold is `critical` (not `high`) only because the tree
      # already carries known highs — one needs a breaking major bump.
      # Renovate (renovate.json) + per-site Dependabot open security PRs
      # that bypass the 7-day cooldown; raise this to `high` once the
      # current high-severity advisories are cleared.
      - name: Audit — fail on critical
        run: |
          status=0
          for dir in . templates/musician-site claude/skills/crawl-artist-site; do
            echo "::group::npm audit --audit-level=critical ($dir)"
            ( cd "$dir" && npm audit --audit-level=critical ) || status=1
            echo "::endgroup::"
          done
          exit $status

      # Visibility only (never fails the build): surface high-severity
      # advisories so the backlog stays tracked in CI output.
      - name: Audit — report high (non-blocking)
        continue-on-error: true
        run: |
          for dir in . templates/musician-site claude/skills/crawl-artist-site; do
            echo "::group::npm audit --audit-level=high ($dir)"
            ( cd "$dir" && npm audit --audit-level=high ) || echo "::warning title=npm audit::high-severity advisories present in $dir"
            echo "::endgroup::"
          done

  # TEMPORARY STUB (ADR-014). The real `musician-site-legacy` template + its CI
  # job were removed, but "Template (musician-site-legacy)" is still a *required*
  # status check in branch protection — and a required check that never runs
  # blocks every PR from merging. This no-op reports that check green so the
  # legacy-removal PRs can land. CLEANUP: drop "Template (musician-site-legacy)"
  # from the required status checks on `main`, then delete this job. Tracked in
  # docs/musician-site-legacy-removal-plan.md.
  musician-site-legacy:
    name: Template (musician-site-legacy)
    runs-on: ubuntu-latest
    steps:
      - run: echo "musician-site-legacy retired in ADR-014; stub satisfying a stale required status check (see comment above)."

  musician-site:
    name: Template (musician-site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/musician-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/musician-site/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # Cache the Playwright browser binaries — saves ~30-60s per run
      # once warm. Keyed off package-lock so a Playwright version bump
      # busts the cache and forces a fresh install.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('templates/musician-site/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System deps for the cached-browser path (the binary cache hits
      # but the OS deps don't persist across runners).
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: templates/musician-site/playwright-report/
          retention-days: 7

  # Apply any pending Prisma migrations to the production Neon DB after
  # a PR merges to main. Runs only on push-to-main (not on PRs, where the
  # new migration always shows pending and would force a manual step).
  #
  # Why apply, not verify: a merged PR with a migration triggers two
  # parallel deploys — this job, and Netlify's build. If we only verified
  # here, prod would throw P2022 on the new column until someone ran
  # `npm run db:migrate:prod` locally. `migrate deploy` is idempotent —
  # a no-op when there's nothing pending — so it's safe to run every push.
  #
  # Race window: Netlify's build (~90s) is much slower than this job
  # (~10s with cached node_modules), so the migration usually lands well
  # before the new code goes live. Not bulletproof — for stricter
  # ordering, run the migration as part of the Netlify build itself.
  #
  # Skipped when the PRODUCTION_DATABASE_URL secret is unset (e.g. on forks).
  db-migrations-applied:
    name: DB migrations applied to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - name: Apply pending migrations to production
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: packages/db
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "::warning::PRODUCTION_DATABASE_URL secret not set; skipping migration apply."
            exit 0
          fi
          # Idempotent: no-op when no pending migrations.
          DATABASE_URL="$PRODUCTION_DATABASE_URL" npx prisma migrate deploy
